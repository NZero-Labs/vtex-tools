services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vtex_tools
      POSTGRES_PASSWORD: vtex_tools
      POSTGRES_USER: vtex_tools
    ports:
      - "5432:5432"
    volumes:
      - vtex_tools_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vtex_tools -d vtex_tools"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vtex_tools_postgres:
